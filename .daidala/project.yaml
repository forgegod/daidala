schema: daidala.project/v1
project_id: forgegod-daidala
repository:
  forge: github
  canonical: forgegod/daidala
  allowed_remote_urls:
    - git@github.com:forgegod/daidala.git
workflow:
  allowed_packs:
    - name: addyosmani
      source_revision: bf223959faae96825f78ddf7bc33e114f3303c1e
      content_digest: 55047d5f565a11fd033a7575991127cdbac47234b92a9afef2198eadbdfac0ec
    - name: aidlc
      source_revision: e49341dbeb8af82758dd85e96ed7fe9bcf38a447
      content_digest: d2cb34137387162055d94981b91a4c5cd3cbf0c8b8fe8901c30ffc7877b96475
  default_pack: addyosmani
  default_constraints:
    source: .daidala/constraints.yaml
verification:
  suites:
    - id: repository
      kind: deterministic
      commands:
        - lefthook validate
        - pytest
        - ruff check .
        - daidala packs validate addyosmani
        - daidala packs validate aidlc
        - python scripts/check_md_links.py .
        - python -m build
        - python -m twine check dist/*
        - python scripts/check_release_contents.py . --wheel dist/*.whl
      timeout_seconds: 3600
    - id: stability
      kind: repeated
      command: pytest
      timeout_seconds: 600
      repetitions: 3
      acceptance:
        maximum_failures: 0
    - id: agent-observations
      kind: observational
      fields:
        - ambiguity
        - recovery-quality
        - handoff-quality
improvement:
  mutable_paths:
    - daidala/**
    - tests/**
    - docs/**
    - .github/**
    - .daidala/constraints.yaml
  protected_paths:
    - .daidala/project.yaml
    - .git/**
    - .env
  maximum_changed_files: 20
  approval_roles:
    - maintainer
intake:
  adapter: github-issues
  eligible_categories:
    - regression
    - improvement
    - compatibility
    - skill-gap
    - research-candidate
release:
  allow_commit: false
  allow_push: false
  allow_publish: false
